[project]
name = "gittrack"
version = "0.1.0"
description = "Spot GitHub repos gaining abnormal traction, by tracking star and fork velocity over time."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["github", "trending", "stars", "analytics", "velocity", "dashboard"]
authors = [{ name = "jmartinmatias" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Version Control :: Git",
    "Topic :: Utilities",
]
dependencies = [
    "httpx>=0.27",
    "rich>=13.7",
]

[project.urls]
Homepage = "https://github.com/jmartinmatias/gittrack"
Repository = "https://github.com/jmartinmatias/gittrack"
Issues = "https://github.com/jmartinmatias/gittrack/issues"

[project.scripts]
gittrack = "gittrack.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gittrack"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 92
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "B", "SIM", "RUF", "I"]
ignore = ["E501", "SIM108"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
