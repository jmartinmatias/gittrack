<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gittrack</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div class="wrap">
  <header>
    <h1>gittrack</h1>
    <!-- One switcher, moved into whichever view is active, so there is never a
         second copy of it to keep in sync. -->
    <div class="seg" id="view-seg" role="group" aria-label="View" hidden>
      <button aria-pressed="true" data-view="trending">Trending</button>
      <button aria-pressed="false" data-view="velocity">Velocity</button>
    </div>
    <div class="metrics-slot" id="metrics-slot"></div>
    <button id="fetch" title="Fetch fresh data from GitHub and store it">⤓ Fetch now</button>
    <button class="ghost" id="theme" title="Toggle theme">◐</button>
    <button class="ghost" id="refresh" title="Re-read stored data">↻</button>
  </header>

  <div class="fetchbar" id="fetchbar"></div>

  <div id="view-velocity">
  <div class="tiles" id="tiles"></div>

  <!-- One filter row, above everything it scopes. -->
  <div class="filters">
    <span class="fgroup view-slot" id="view-slot-velocity"></span>
    <span class="fgroup"><span class="flabel">window</span>
      <span class="seg" id="window-seg" role="group" aria-label="Trend window"></span></span>
    <span class="fgroup"><span class="flabel">stars</span>
    <select id="band">
      <option value="">any</option>
      <option value="0-1000">under 1k</option>
      <option value="1000-20000">1k – 20k · the hunting band</option>
      <option value="20000-100000">20k – 100k</option>
      <option value="100000-">over 100k</option>
    </select></span>
    <span class="fgroup"><span class="flabel">language</span>
    <select id="lang"><option value="">any</option></select></span>
    <input id="search" type="search" placeholder="filter by name…" autocomplete="off">
    <label class="flabel" style="display:inline-flex;gap:6px;align-items:center;cursor:pointer">
      <input type="checkbox" id="only-ready" checked style="width:auto"> enough history
    </label>
  </div>

  <section id="detail" hidden></section>

  <div class="board-wrap">
    <table id="board">
      <thead><tr id="head"></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
  <div class="empty" id="empty" hidden></div>
  </div><!-- /view-velocity -->

  <div id="view-trending" hidden>
    <div class="tiles" id="t-tiles"></div>
    <div class="filters">
      <span class="fgroup view-slot" id="view-slot-trending"></span>
      <span class="fgroup"><span class="flabel">board</span>
        <span class="seg" id="t-since" role="group" aria-label="Trending board"></span></span>
      <span class="fgroup"><span class="flabel">rank by</span>
        <span class="seg" id="t-rankby" role="group" aria-label="Ranking metric"></span></span>
      <span class="fgroup"><span class="flabel">language</span>
        <select id="t-lang"><option value="">all</option></select></span>
      <span class="fgroup"><span class="flabel">period</span>
        <span class="seg" id="t-period" role="group" aria-label="Period"></span></span>
      <span class="spacer"></span>
      <button class="ghost" id="t-more" type="button"
              title="Show the ranking metric, every table column, and the owner and co-movement panels">more</button>
    </div>
    <section class="digest card" id="digest" hidden></section>
    <div class="note" id="t-note" hidden>
      <span class="body" id="t-note-body"></span>
      <button class="toggle" id="t-note-toggle" type="button">more</button>
    </div>
    <details class="landscape card" id="landscape" open>
      <summary>Landscape - where these repos sit, and how they got there</summary>
      <!-- Row 1: the two scatters, equal width. -->
      <div class="lrow">
        <div>
          <div class="chart-title">size vs strength</div>
          <div class="chart-note" id="scatter-note"></div>
          <div class="plot" id="scatter"></div>
        </div>
        <div>
          <div class="chart-title">adoption vs attention</div>
          <div class="chart-note" id="adopt-note"></div>
          <div class="plot" id="adopt"></div>
        </div>
      </div>

      <!-- Row 2: the two bar charts, equal width. -->
      <div class="lrow">
        <div>
          <div class="chart-title">accelerating or cooling</div>
          <div class="chart-note" id="accel-note"></div>
          <div class="plot" id="accel"></div>
        </div>
        <div>
          <div class="chart-title">shared themes</div>
          <div class="chart-note" id="themes-note"></div>
          <div id="themes"></div>
        </div>
      </div>

      <!-- Row 3: the text relationships, across the full width. -->
      <div class="lwide" id="relations"></div>
    </details>
    <section id="t-detail" hidden></section>
    <div class="board-wrap">
      <table id="t-board">
        <thead><tr id="t-head"></tr></thead>
        <tbody id="t-rows"></tbody>
      </table>
    </div>
    <div class="empty" id="t-empty" hidden></div>
  </div>

  <footer>
    Click any row for the full history. Sort by clicking a column.
    <kbd>Esc</kbd> closes the detail panel.
    <span id="gen"></span>
  </footer>
</div>

<script src="/app.js"></script>
</body>
</html>
